name: Build Rocky 10 bootc Image

# NOTE: bootc builds with XFS filesystems cannot complete post-processing in GitHub Actions
# due to lack of kernel module support (XFS has no FUSE driver, libguestfs fails in containers).
# This workflow is provided for manual local builds only.
# Use the standard rocky10 workflow for CI/CD automation.

on:
  workflow_dispatch:
    inputs:
      bootc_image_ref:
        description: 'bootc container image reference (e.g., quay.io/user/image:tag)'
        required: false
        type: string
        default: 'quay.io/centos-bootc/centos-bootc:stream10'
      bootc_registry_url:
        description: 'Container registry URL (optional, for authentication)'
        required: false
        type: string
      bootc_registry_insecure:
        description: 'Allow insecure (HTTP) registry'
        required: false
        type: boolean
        default: false
      architecture:
        description: 'Architecture to build'
        required: false
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - aarch64
      timeout:
        description: 'Build timeout (bootc is faster, usually 30-45 min)'
        required: false
        default: '1h'
        type: string

env:
  PACKER_VERSION: '1.11.0'
  # Default bootc image for automated builds (public CentOS Stream 10 bootc image)
  DEFAULT_BOOTC_IMAGE: 'quay.io/centos-bootc/centos-bootc:stream10'
  DEFAULT_ARCH: 'x86_64'
  DEFAULT_TIMEOUT: '1h'

jobs:
  lint:
    name: Lint and Validate (bootc)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Initialize Packer
        working-directory: rocky10
        run: packer init rocky10-bootc.pkr.hcl

      - name: Validate Packer template
        working-directory: rocky10
        run: |
          packer validate \
            -var bootc_image_ref="registry:example.com/test:latest" \
            rocky10-bootc.pkr.hcl

      - name: Check Packer formatting
        working-directory: rocky10
        run: packer fmt -check -diff .

  build:
    name: Build Rocky 10 bootc (${{ github.event.inputs.architecture || 'x86_64' }})
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-system-arm \
            qemu-utils \
            qemu-system-modules-spice \
            libnbd-bin \
            nbdkit \
            fuse2fs \
            ovmf \
            cloud-image-utils \
            parted \
            libguestfs-tools

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Cache Packer plugins
        uses: actions/cache@v4
        with:
          path: ~/.config/packer/plugins
          key: packer-plugins-${{ runner.os }}-${{ hashFiles('rocky10/rocky10-bootc.pkr.hcl') }}
          restore-keys: |
            packer-plugins-${{ runner.os }}-

      - name: Cache Rocky ISO
        uses: actions/cache@v4
        with:
          path: rocky10/packer_cache
          key: rocky10-iso-${{ github.event.inputs.architecture || env.DEFAULT_ARCH }}-${{ hashFiles('rocky10/rocky10-bootc.pkr.hcl') }}
          restore-keys: |
            rocky10-iso-${{ github.event.inputs.architecture || env.DEFAULT_ARCH }}-

      - name: Initialize Packer
        working-directory: rocky10
        run: packer init rocky10-bootc.pkr.hcl

      - name: Build Rocky 10 bootc image
        working-directory: rocky10
        env:
          PACKER_LOG: 1
          TIMEOUT: ${{ github.event.inputs.timeout || env.DEFAULT_TIMEOUT }}
          ARCH: ${{ github.event.inputs.architecture || env.DEFAULT_ARCH }}
          BOOTC_IMAGE: ${{ github.event.inputs.bootc_image_ref || env.DEFAULT_BOOTC_IMAGE }}
          BOOTC_REGISTRY_URL: ${{ github.event.inputs.bootc_registry_url }}
          BOOTC_REGISTRY_INSECURE: ${{ github.event.inputs.bootc_registry_insecure || 'false' }}
          # Note: BOOTC_REGISTRY_AUTH should be set as a GitHub secret
          BOOTC_REGISTRY_AUTH: ${{ secrets.BOOTC_REGISTRY_AUTH }}
        run: |
          # Prepare OVMF files
          if [ ! -f /usr/share/OVMF/OVMF_CODE.fd ]; then
            export OVMF_SFX="_4M"
          else
            export OVMF_SFX=""
          fi

          cp -v /usr/share/OVMF/OVMF_VARS${OVMF_SFX}.fd ${ARCH}_VARS.fd

          if [ "${ARCH}" = "aarch64" ]; then
            truncate -s 64m ${ARCH}_VARS.fd
          else
            truncate -s 2m ${ARCH}_VARS.fd
          fi

          # Detect host architecture
          if [ "$(uname -m)" = "aarch64" ]; then
            export HOST_IS_ARM=true
          else
            export HOST_IS_ARM=false
          fi

          echo "Building with bootc image: ${BOOTC_IMAGE}"
          echo "Architecture: ${ARCH}"
          echo "Timeout: ${TIMEOUT}"

          # Build with bootc-specific parameters
          packer build \
            -var architecture=${ARCH} \
            -var host_is_arm=${HOST_IS_ARM} \
            -var timeout=${TIMEOUT} \
            -var ovmf_suffix=${OVMF_SFX} \
            -var use_kvm=false \
            -var bootc_image_ref="${BOOTC_IMAGE}" \
            $([ -n "${BOOTC_REGISTRY_URL}" ] && echo "-var bootc_registry_url=${BOOTC_REGISTRY_URL}") \
            $([ -n "${BOOTC_REGISTRY_AUTH}" ] && echo "-var bootc_registry_auth=${BOOTC_REGISTRY_AUTH}") \
            -var bootc_registry_insecure=${BOOTC_REGISTRY_INSECURE} \
            rocky10-bootc.pkr.hcl

      - name: Generate build metadata
        working-directory: rocky10
        env:
          ARCH: ${{ github.event.inputs.architecture || env.DEFAULT_ARCH }}
          BOOTC_IMAGE: ${{ github.event.inputs.bootc_image_ref || env.DEFAULT_BOOTC_IMAGE }}
        run: |
          echo "Build Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > rocky10-bootc-${ARCH}.buildinfo
          echo "Architecture: ${ARCH}" >> rocky10-bootc-${ARCH}.buildinfo
          echo "bootc Image: ${BOOTC_IMAGE}" >> rocky10-bootc-${ARCH}.buildinfo
          echo "Git Commit: ${{ github.sha }}" >> rocky10-bootc-${ARCH}.buildinfo
          echo "Workflow Run: ${{ github.run_id }}" >> rocky10-bootc-${ARCH}.buildinfo
          echo "Trigger: ${{ github.event_name }}" >> rocky10-bootc-${ARCH}.buildinfo
          cat rocky10-bootc-${ARCH}.buildinfo

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocky10-bootc-${{ github.event.inputs.architecture || env.DEFAULT_ARCH }}-image
          path: |
            rocky10/rocky10-bootc.tar.gz
            rocky10/rocky10-bootc-${{ github.event.inputs.architecture || env.DEFAULT_ARCH }}.buildinfo
          retention-days: 30
          compression-level: 0

      - name: Display artifact info
        working-directory: rocky10
        env:
          ARCH: ${{ github.event.inputs.architecture || env.DEFAULT_ARCH }}
        run: |
          ls -lh rocky10-bootc.tar.gz
          sha256sum rocky10-bootc.tar.gz > rocky10-bootc-${ARCH}.sha256
          cat rocky10-bootc-${ARCH}.sha256

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: rocky10-bootc-${{ github.event.inputs.architecture || env.DEFAULT_ARCH }}-checksum
          path: rocky10/rocky10-bootc-${{ github.event.inputs.architecture || env.DEFAULT_ARCH }}.sha256
          retention-days: 30
